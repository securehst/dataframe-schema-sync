name: Sync Github labels

on:
  push:
    branches:
      - main
    paths:
      - ".github/labels.yml"
      - ".github/workflows/labels.yml"
  pull_request:
    paths:
      - ".github/labels.yml"
      - ".github/workflows/labels.yml"

jobs:
  labels:
    runs-on: self-hosted
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Sync config with Github
        uses: crazy-max/ghaction-github-labeler@548a7c3603594ec17c819e1239f281a3b801ab4d # v6.0.0
        with:
          yaml-file: .github/labels.yml
          # Pull requests only preview the changes; they are applied once merged to main
          dry-run: ${{ github.event_name == 'pull_request' }}
          # Never delete: a label missing from the file may still be on issues and PRs
          skip-delete: true
